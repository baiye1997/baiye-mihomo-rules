# ======================= 规则集 =======================
cls: &cls {type: http, behavior: classical, interval: 43200, format: text, proxy: "🚀 节点选择"}
dom: &dom {type: http, behavior: domain, interval: 43200, format: text, proxy: "🚀 节点选择"}

rule-providers:
  game_non_ip:     {<<: *cls, url: "https://cdn.jsdelivr.net/gh/baiye1997/baiye-mihomo-rules@main/rules/non_ip/game.txt", path: ./rules/non_ip/game.txt}
  game_ip:         {<<: *cls, url: "https://cdn.jsdelivr.net/gh/baiye1997/baiye-mihomo-rules@main/rules/ip/game.txt", path: ./rules/ip/game.txt}
