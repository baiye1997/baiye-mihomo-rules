# ============================================================
# Baiye Mihomo Lite：GEO 上游版
# 适合：偏好 GEOSITE / GEOIP 上游规则的日常使用
# 特点：主要使用 GEO 上游，规则文件较少；真正轻量版由 Gist 脚本生成 mini
# ============================================================

url: &url "https://www.gstatic.com/generate_204"
blk: &blk '^(?!.*(?i)(DIRECT|直接连接|群|邀请|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|备用|过期|已用|联系|邮箱|工单|通知|地址|频道|说明|教程|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)).*$'
prov: &prov {type: http, interval: 3600, health-check: {enable: true, url: *url, interval: 600}}

# ======================= 只改这里：订阅 =======================
proxy-providers:
  Sub-1:
    <<: *prov
    url: "替换订阅链接1"
    path: "./proxy_provider/providers-1.yaml"
    override:
      additional-prefix: "[显示名称1]"
    filter: *blk

  Sub-2:
    <<: *prov
    url: "替换订阅链接2"
    path: "./proxy_provider/providers-2.yaml"
    override:
      additional-prefix: "[显示名称2]"
    filter: *blk

# ======================= 基础配置 =======================
mixed-port: 7890
# 安全默认值：仅本机使用；需要局域网共享时请同时配置认证或 lan-allowed-ips
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off

external-controller: 127.0.0.1:9090
# external-ui: ui
# external-ui-name: zashboard
# external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

keep-alive-idle: 60
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

# ======================= DNS =======================
dns:
  enable: true
  prefer-h3: false
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fallback:
    - "https://1.1.1.1/dns-query#🚀 节点选择"
    - "https://8.8.8.8/dns-query#🚀 节点选择"

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

  fake-ip-filter:
    - rule-set:fake-ip
    - geosite:private
    - geosite:connectivity-check
    - "+.miwifi.com"
    - "+.mijia.tech"
    - "+.market.xiaomi.com"

# ======================= 嗅探 =======================
sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS:  {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain:
    - rule-set:sniff-skip
    - "Mijia Cloud"

# ======================= TUN：Lite 默认关闭，需要时可直接开启 =======================
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: 1500

# ======================= Geodata =======================
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"

# ======================= 策略组锚点 =======================
tmpl: &tmpl {url: *url, interval: 300, lazy: true, timeout: 5000, disable-udp: false, max-failed-times: 3, hidden: true, include-all-providers: true, exclude-filter: "(?i)(DIRECT|直接连接|官网|订阅|流量|到期|套餐|客服|群|邀请|网址|剩余|过期|LAN|(?:^|[^0-9.])0?\\.[0-9]+\\s*(?:x|×|倍(?:率)?)(?:$|[^0-9A-Za-z])|(?:^|[^0-9.])5x(?:$|[^0-9]))"}
sel:  &sel  {type: select, url: *url, disable-udp: false, hidden: false, include-all-providers: true, exclude-filter: "(?i)(DIRECT|直接连接|官网|订阅|流量|到期|套餐|客服|群|邀请|网址|剩余|过期|LAN)"}
test: &test {type: url-test, <<: *tmpl, tolerance: 50}
fall: &fall {type: fallback, <<: *tmpl}

entr: &entr {type: select, proxies: ["♻️ 智能选择","👆 手动选择","DIRECT"]}
app:  &app  {type: select, proxies: ["♻️ 智能选择","👆 手动选择","DIRECT","🇭🇰 - 择优节点","🇨🇳 - 择优节点","🇯🇵 - 择优节点","🇰🇷 - 择优节点","🇸🇬 - 择优节点","🇺🇸 - 择优节点"]}
aiapp: &aiapp {type: select, proxies: ["🧠 AI 专用节点","👆 手动选择"]}
drc:  &drc  {type: select, proxies: ["DIRECT","♻️ 智能选择","👆 手动选择","🇭🇰 - 择优节点","🇨🇳 - 择优节点","🇯🇵 - 择优节点","🇸🇬 - 择优节点","🇺🇸 - 择优节点"]}
strm: &strm {type: select, proxies: ["♻️ 智能选择","👆 手动选择","DIRECT","🇭🇰 - 择优节点","🇨🇳 - 择优节点","🇯🇵 - 择优节点","🇰🇷 - 择优节点","🇸🇬 - 择优节点","🇺🇸 - 择优节点","🇭🇰 - 自动回退","🇨🇳 - 自动回退","🇯🇵 - 自动回退","🇸🇬 - 自动回退","🇺🇸 - 自动回退"]}
tg:   &tg   {type: select, proxies: ["♻️ 智能选择","👆 手动选择","DIRECT","🇸🇬 - 择优节点","🇭🇰 - 择优节点","🇯🇵 - 择优节点","🇺🇸 - 择优节点"]}

hk: &hk '^(?=.*(?i)(港|🇭🇰|Hong|(?:^|[^A-Za-z])(?:HK|HKG)(?:$|[^A-Za-z])))(?!.*(?i)(?:^|[^0-9.])5x(?:$|[^0-9])).*$'
tw: &tw '^(?=.*(?i)(台|台湾|臺|🇹🇼|Taiwan|Taipei|(?:^|[^A-Za-z])(?:TW|TPE|TSA|KHH)(?:$|[^A-Za-z])))(?!.*(?i)(?:^|[^0-9.])5x(?:$|[^0-9])).*$'
jp: &jp '^(?=.*(?i)(日|🇯🇵|Japan|(?:^|[^A-Za-z])(?:JP|NRT|HND|KIX|CTS|FUK)(?:$|[^A-Za-z])))(?!.*(?i)(尼日利亚|(?:^|[^0-9.])5x(?:$|[^0-9]))).*$'
kr: &kr '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|Korea|South Korea|(?:^|[^A-Za-z])(?:KR|KOR)(?:$|[^A-Za-z])))(?!.*(?i)(?:^|[^0-9.])5x(?:$|[^0-9])).*$'
sg: &sg '^(?=.*(?i)(坡|🇸🇬|Sing|(?:^|[^A-Za-z])(?:SG|SIN|XSP)(?:$|[^A-Za-z])))(?!.*(?i)(?:^|[^0-9.])5x(?:$|[^0-9])).*$'
us: &us '^(?=.*(?i)(美|🇺🇸|硅谷|Silicon|United States|(?:^|[^A-Za-z])(?:US|USA|JFK|SJC|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)(?:$|[^A-Za-z])))(?!.*(?i)(?:^|[^0-9.])5x(?:$|[^0-9])).*$'
ai: &ai '(?i)(AI专用|AI解锁)'

# ======================= 策略组 =======================
proxy-groups:
  - {name: "🚀 节点选择", <<: *entr, icon: "https://cdn.jsdelivr.net/gh/baiye1997/baiye-mihomo-rules@main/icons/choice.png"}
  - {name: "👆 手动选择", <<: *sel, icon: "https://cdn.jsdelivr.net/gh/baiye1997/baiye-mihomo-rules@main/icons/select.png"}
  - {name: "♻️ 智能选择", <<: *test, icon: "https://cdn.jsdelivr.net/gh/baiye1997/baiye-mihomo-rules@main/icons/auto.png"}

  - {name: "🌐 全球直连", <<: *drc, icon: "https://cdn.jsdelivr.net/gh/baiye1997/baiye-mihomo-rules@main/icons/link.png"}
