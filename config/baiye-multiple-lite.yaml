  - {name: "🇯🇵 - 择优节点", <<: *test, filter: *jp}
  - {name: "🇰🇷 - 择优节点", <<: *test, filter: *kr}
  - {name: "🇸🇬 - 择优节点", <<: *test, filter: *sg}
  - {name: "🇺🇸 - 择优节点", <<: *test, filter: *us}

  - {name: "🇭🇰 - 自动回退", <<: *fall, filter: *hk}
  - {name: "🇨🇳 - 自动回退", <<: *fall, filter: *tw}
