name: Sync External Rules
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Diagnose subscription snapshots without publication
        env:
          SUB_URL_1: ${{ secrets.SUB_URL_1 }}
          SUB_URL_2: ${{ secrets.SUB_URL_2 }}
        run: |
          node - <<'JS'
          const {spawnSync}=require('child_process');
          for(let i=1;i<=2;i++) {
            const result=spawnSync(process.execPath,['-e',"require('./.github/scripts/build-and-publish').collectSubscriptions().then(r=>console.log('OK nodes='+r.snapshots[0].length)).catch(e=>console.log(e.message))"],{env:{...process.env,SUB_URLS:process.env['SUB_URL_'+i]},encoding:'utf8',timeout:30000});
            console.log('slot '+i+': '+result.stdout.trim());
            if(result.error) console.log('process timeout');
          }
          JS
