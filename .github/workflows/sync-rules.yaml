name: Sync External Rules
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Diagnose subscription snapshots without publication
        env:
          SUB_URL_1: ${{ secrets.SUB_URL_1 }}
          SUB_URL_2: ${{ secrets.SUB_URL_2 }}
        run: |
          node - <<'JS'
          const {spawnSync}=require('child_process');
          const YAML=require('yaml');
          for(const ua of ['clash.meta','ClashMeta/v1.19.29','FlClash/v0.8.92','Mozilla/5.0']) {
            const r=spawnSync('curl',['-sS','-L','--connect-timeout','10','--max-time','25','-A',ua,'-w','\n%{http_code}',process.env.SUB_URL_1],{encoding:'utf8',timeout:30000});
            const body=(r.stdout||'').slice(0,-4),status=(r.stdout||'').slice(-3);
            let nodes=0;try {nodes=YAML.parse(body)?.proxies?.length||0;}catch{}
            console.log(JSON.stringify({transport:'curl',ua,http:status,exit:r.status,nodes,challenge:/challenge-platform|Just a moment|cf-chl-/.test(body)}));
          }
          JS
