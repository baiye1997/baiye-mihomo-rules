name: Publish Gists

on:
  workflow_run:
    workflows: ["Purge CDN"]
    types: [completed]
    branches: [main]

  workflow_dispatch: {}

  # PR 触发：仅用于测试配置是否正确 (自动 Dry Run)
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'config/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'package*.json'
      - 'rules/**'

concurrency:
  group: publish-gist-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Prepare pinned Mihomo and Geo data
        run: bash .github/scripts/prepare-mihomo.sh

      - name: Check generation and runtime behavior
        run: npm test

      - name: Build & Publish to Gists
        env:
          # === Tokens / Gists
          GIST_TOKEN:        ${{ secrets.GIST_TOKEN }}
          GIST_ID_STANDARD:  ${{ secrets.GIST_ID_STANDARD }}
          GIST_ID_LITE:      ${{ secrets.GIST_ID_LITE }}

          # === Single Subscription (不再生成双订阅，续费的订阅填在 SUB_URL_1)
          SUB_URLS: |
            ${{ secrets.SUB_URL_1 }}

          SUB_NAMES: |
            [月读]

          # Optional: 专属美国静态住宅 AI 代理，格式如 socks5://user:pass@ip:port
          AI_STATIC_PROXY: ${{ secrets.AI_STATIC_PROXY }}

          # Optional manual additions, comma/newline separated.
          SUB_SERVER_DOMAINS: ${{ secrets.SUB_SERVER_DOMAINS }}

          COMMIT_SHORT: ${{ github.sha }}

          # === Files (仅生成单订阅标准版/Lite 及对应 Mini 版)
          CONFIG_SINGLE_STD:     config/baiye-single.yaml
          CONFIG_SINGLE_LITE:    config/baiye-single-lite.yaml

          GIST_FILE_SINGLE_STD:    baiye-single.yaml
          GIST_FILE_MINI_STD:      baiye-mini.yaml
          GIST_FILE_SINGLE_LITE:   baiye-single-lite.yaml
          GIST_FILE_MINI_LITE:     baiye-mini-lite.yaml

          # PR 强制 Dry Run；正式发布为 false
          DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          QUIET:   "true"
          STATUS_FILE: status-publish.txt

        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            # PR checks need neither subscription credentials nor a publish token.
            export SUB_URLS='https://example.invalid/one'
            export AI_STATIC_PROXY=''
          fi
          node .github/scripts/build-and-publish.js

      - name: Show status file
        if: always()
        run: |
          test -f status-publish.txt && echo "Status: $(cat status-publish.txt)" || echo "No status file"
